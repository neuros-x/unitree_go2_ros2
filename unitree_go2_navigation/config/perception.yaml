# Velodyne cloud -> 2D scan -> self-filtered scan. One /scan feeds SLAM, AMCL,
# both costmaps and the collision monitor, so its parameters live in one place.
pointcloud_to_laserscan:
  ros__parameters:
    # base_footprint is level and sits on the ground under the body, so the
    # height window below is height above the floor whatever the trunk pitch.
    target_frame: base_footprint
    transform_tolerance: 0.1
    min_height: 0.12          # above the floor: drops ground returns
    max_height: 1.2           # well above the trunk: keeps tables, walls, people
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0143   # 2*pi / 440, the VLP-16 horizontal resolution in sim
    scan_time: 0.1
    range_min: 0.35           # inside this is the robot itself
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0

# Self-filter: anything that lands inside the body/leg envelope (a box around
# base_link) is removed before SLAM or Nav2 see it. Set invert/limits here to
# tune; set the launch argument self_filter:=false to bypass it entirely.
scan_self_filter:
  ros__parameters:
    filter1:
      name: go2_body_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.50
        max_x: 0.50
        min_y: -0.28
        max_y: 0.28
        min_z: -0.60
        max_z: 0.40
        invert: false
